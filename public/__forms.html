<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Formulaire technique — Heures &amp; Passion</title>
  </head>
  <body>
    <!-- Déclaration statique requise par Netlify Forms. Garder les noms alignés avec ContactForm. -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="firstName" /><input name="lastName" /><input type="email" name="email" />
      <input type="tel" name="phone" /><input name="subject" /><textarea name="message"></textarea>
      <input type="checkbox" name="consent" value="yes" />
    </form>
    <a href="/contact">Contacter Heures &amp; Passion</a>
  </body>
</html>
